[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-cash-review"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.20", "pydantic-settings>=2.7,<3", "av>=14,<17", "pillow>=11,<13", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
gpu = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1", "accelerate>=1.10,<2", "peft>=0.17,<0.19", "lm-format-enforcer==0.11.3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["rules.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
